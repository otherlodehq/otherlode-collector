name: release

# A v*.*.* tag that scripts/release.sh pushed starts this workflow. It refuses a tag that does not
# match the declared version, runs the whole suite, pushes a multi-arch image to GHCR, then creates
# the GitHub release. The workflow pins every action to a commit. Every checkout but the
# otherlode.dev one in the docs job leaves no git credentials on disk.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

# The image job moves `latest`, so two release runs must not run at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag, the version, the branch and the changelog
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^const version = "\(.*\)"$/\1/p' cmd/otherlode-collector/version.go)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not equal v$version from cmd/otherlode-collector/version.go"; exit 1
          fi
          case "$version" in
            *-SNAPSHOT) echo "::error::version $version is a SNAPSHOT"; exit 1 ;;
          esac
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::version $version is not X.Y.Z"; exit 1
          fi
          git fetch --no-tags origin master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::the tagged commit $GITHUB_SHA is not on origin/master"; exit 1
          fi
          section=$(scripts/changelog-section.sh "$version")
          if ! [[ "$section" =~ [^[:space:]] ]]; then
            echo "::error::CHANGELOG.md has no non-empty '## [$version]' section"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    name: test
    needs: guard
    uses: ./.github/workflows/ci.yml

  # A rerun of this job pushes the same tags again, to a new digest, since a container tag is
  # mutable. The release notes name the digest of the run that created the release.
  image:
    name: image
    needs: [guard, test]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The 0.x line promises no compatibility, so it gets no major-version tag. A release from
      # 1.0.0 on gets one. The annotations go on the index too, since GHCR reads a multi-arch
      # image's description there.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/otherlodehq/otherlode-collector
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
          flavor: |
            latest=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.guard.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/otherlodehq/otherlode-collector
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # This job is separate from the image job and has write access to contents and nothing else.
  # Rerunning it alone after a failure never pushes the image again. It creates no draft itself.
  # It replaces a draft made by hand for the tag and leaves a published release alone.
  github-release:
    name: github release
    needs: [guard, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::the image job reported no digest"; exit 1
          fi
          {
            scripts/changelog-section.sh "$version"
            echo
            echo "Image: \`ghcr.io/otherlodehq/otherlode-collector:$version\`, digest \`$DIGEST\`."
          } > release-notes.md

          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.id) \(.draft)\"")
          while read -r id draft; do
            [ -n "$id" ] || continue
            if [ "$draft" = true ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            else
              echo "::error::a published release for $TAG already exists; nothing to do"; exit 1
            fi
          done <<< "$existing"

          gh release create "$TAG" --verify-tag --title "otherlode-collector $version" --notes-file release-notes.md

  # Opens a pull request on otherlode.dev that copies docs/site/ into its
  # /docs. It does nothing until the release environment's secret
  # OTHERLODE_DEV_DOCS_TOKEN exists. Scope the token to otherlode.dev alone,
  # and keep it out of the repository secrets.
  docs:
    name: sync docs to otherlode.dev
    needs: github-release
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: docs-sync
      cancel-in-progress: false
    steps:
      - name: Check for the sync token
        id: token
        env:
          TOKEN: ${{ secrets.OTHERLODE_DEV_DOCS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::OTHERLODE_DEV_DOCS_TOKEN is not set, so the docs are not synced."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: otherlodehq/otherlode.dev
          token: ${{ secrets.OTHERLODE_DEV_DOCS_TOKEN }}
          path: site
      - name: Open the pull request
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.OTHERLODE_DEV_DOCS_TOKEN }}
          TAG: ${{ github.ref_name }}
        working-directory: site
        run: scripts/sync-docs.sh collector "$GITHUB_WORKSPACE/source/docs/site" "otherlode-collector $TAG" "$TAG"
