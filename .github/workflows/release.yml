name: release

# Started by a v*.*.* tag that scripts/release.sh pushed (ADR 0006). Refuses a tag that does not
# match the declared version, runs the whole suite, pushes a multi-arch image to GHCR, then creates
# the GitHub release. The jobs that can write use actions pinned to a commit and keep no git
# credentials on disk.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

# One release at a time: the image job moves `latest`, so two runs must not race for it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag, the version, the branch and the changelog
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^const version = "\(.*\)"$/\1/p' cmd/otherlode-collector/version.go)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not equal v$version from cmd/otherlode-collector/version.go"; exit 1
          fi
          case "$version" in
            *-SNAPSHOT) echo "::error::version $version is a SNAPSHOT"; exit 1 ;;
          esac
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::version $version is not X.Y.Z"; exit 1
          fi
          git fetch --no-tags origin master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::the tagged commit $GITHUB_SHA is not on origin/master"; exit 1
          fi
          section=$(scripts/changelog-section.sh "$version")
          if ! [[ "$section" =~ [^[:space:]] ]]; then
            echo "::error::CHANGELOG.md has no non-empty '## [$version]' section"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    name: test
    needs: guard
    uses: ./.github/workflows/ci.yml

  # A rerun of this job pushes the same tags again, to a new digest: a container tag is mutable,
  # and the release notes name the digest of the run that created the release.
  image:
    name: image
    needs: [guard, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The 0.x line promises no compatibility, so it gets no X tag; from 1.0.0 it does.
      # Annotations on the index too, which is where GHCR reads a multi-arch image's description.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/otherlodehq/otherlode-collector
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
          flavor: |
            latest=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.guard.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/otherlodehq/otherlode-collector
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Its own job, with write access to contents and nothing else. Rerunning it alone after a failure
  # never pushes the image again. It creates no draft itself; one made by hand for the tag is
  # replaced, and a published release is left alone.
  github-release:
    name: github release
    needs: [guard, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::the image job reported no digest"; exit 1
          fi
          {
            scripts/changelog-section.sh "$version"
            echo
            echo "Image: \`ghcr.io/otherlodehq/otherlode-collector:$version\`, digest \`$DIGEST\`."
          } > release-notes.md

          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.id) \(.draft)\"")
          while read -r id draft; do
            [ -n "$id" ] || continue
            if [ "$draft" = true ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            else
              echo "::error::a published release for $TAG already exists; nothing to do"; exit 1
            fi
          done <<< "$existing"

          gh release create "$TAG" --verify-tag --title "otherlode-collector $version" --notes-file release-notes.md
